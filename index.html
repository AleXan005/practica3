<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Botánico 3D - Azucena</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Panel de Información Botánica (Raycasting) -->
    <aside id="info-panel" class="hud-card">
        <div class="card-header">
            <h3>🌿 Ficha Anatómica</h3>
            <span class="badge">Raycasting</span>
        </div>
        <p id="hint-text">Haz clic sobre cualquier estructura de la planta para examinarla.</p>
        <div id="plant-data" class="hidden">
            <div class="data-row">
                <strong>Estructura:</strong> <span id="part-name">-</span>
            </div>
            <div class="data-row">
                <strong>Geometría:</strong> <span id="part-geo">-</span>
            </div>
            <div class="data-row">
                <strong>Altura relativa (Y):</strong> <span id="part-height">-</span>
            </div>
            <div class="data-row">
                <strong>Función biológica:</strong>
                <p id="part-desc" class="desc-text">-</p>
            </div>
        </div>
    </aside>

    <!-- Barra de Controles de Escena -->
    <nav id="controls-toolbar" class="hud-card">
        <h4>⚙️ Controles del Laboratorio</h4>
        
        <div class="control-group">
            <button id="btn-toggle-anim" class="btn">⏸️ Pausar Viento</button>
            <button id="btn-color-leaves" class="btn">🎨 Color Hojas</button>
            <button id="btn-toggle-leaves" class="btn">👁️ Ocultar Hojas</button>
            <button id="btn-reset-cam" class="btn">🎥 Reiniciar Cámara</button>
        </div>

        <div class="control-group slider-group">
            <label for="slider-light">Intensidad de Luz: <span id="light-val">1.8</span></label>
            <input type="range" id="slider-light" min="0.2" max="4.0" step="0.1" value="1.8">
        </div>
    </nav>

    <script type="module" src="main.js"></script>
</body>
</html>
